name: QuickerWrite WCDB libraries
on:
  push:
    tags: ['qw-*']
  workflow_dispatch:
    inputs:
      existing_android_tag:
        description: Complete an existing Android release from this tag
        required: true
        type: string
      targets:
        description: JSON array of platform names to build
        type: string
        default: '["linux-x86_64","windows-x86_64","openharmony-arm64","ios","macos"]'
      reuse_run:
        description: Previous trusted run containing successful artifacts for this tag
        type: string
env:
  TAG: ${{ inputs.existing_android_tag || github.ref_name }}
permissions:
  contents: read
jobs:
  library:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - run: bash quickerwrite/prepare-android-native.sh
      - run: python3 -m unittest discover -s quickerwrite -p test_wcdb_build.py
      - name: Build the four AARs from the tagged source
        run: python3 quickerwrite/build-wcdb.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --jobs "$(nproc)" --output "$RUNNER_TEMP/wcdb/universal.aar" --release
      - name: Show compiler diagnostics on failure
        if: failure()
        run: find "$RUNNER_TEMP/wcdb" -name build.log -exec tail -60 {} \;
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android
          path: ${{ runner.temp }}/wcdb/*.aar
          if-no-files-found: error
          retention-days: 3

  platforms:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets || '["linux-x86_64","windows-x86_64","openharmony-arm64","ios","macos"]') }}
    runs-on: ${{ matrix.target == 'windows-x86_64' && 'windows-2022' || (matrix.target == 'ios' || matrix.target == 'macos') && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 75
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: quickerwrite
      - shell: bash
        run: |
          [[ "$TAG" =~ ^qw-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - shell: bash
        working-directory: source
        run: git submodule update --init --depth 1 sqlcipher zstd
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install --classic --triplet x64-windows-static-md openssl zlib
      - if: matrix.target == 'openharmony-arm64'
        id: ohos
        uses: openharmony-rs/setup-ohos-sdk@cfd996a9cff9e72a7e59827cb5424fcfae4ada3e
        with:
          version: 5.0.0
          components: native
      - if: matrix.target == 'openharmony-arm64'
        env:
          OHOS_NDK_HOME: ${{ steps.ohos.outputs.ohos_sdk_native }}
          QW_OHOS_OPENSSL: ${{ runner.temp }}/ohos-openssl
        run: bash quickerwrite/openssl-ohos.sh
      - if: runner.os != 'macOS'
        working-directory: source
        env:
          OHOS_NDK_HOME: ${{ steps.ohos.outputs.ohos_sdk_native }}
          QW_OHOS_OPENSSL: ${{ runner.temp }}/ohos-openssl
        shell: bash
        run: python ../quickerwrite/build-desktop.py "$TARGET" ../dist
      - if: runner.os == 'macOS'
        working-directory: source
        run: bash ../quickerwrite/build-apple.sh "$TARGET" "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [platforms, library]
    if: always() && needs.platforms.result == 'success' && (needs.library.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.library.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - if: inputs.reuse_run
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ inputs.reuse_run }}
        run: |
          set -euo pipefail
          [[ "$PREVIOUS" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS" | jq -e --arg branch "$GITHUB_REF_NAME" '.event == "workflow_dispatch" and .head_branch == $branch and .path == ".github/workflows/android-library.yml"'
      - if: inputs.reuse_run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run }}
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Verify and publish all six platforms
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BACKFILL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [[ "$BACKFILL" == true ]]; then
            gh release download "$TAG" -R "$REPO" -p '*.aar' -p SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          fi
          sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          for name in arm64-v8a armeabi-v7a x86_64 universal; do
            test "$(unzip -p "$name.aar" META-INF/qw-native-build.json | jq -r .provenance.commit)" = "$sha"
          done
          for name in ios macos windows-x86_64 linux-x86_64 openharmony-arm64; do
            unzip -tq "wcdb-$name.zip"
            test "$(unzip -p "wcdb-$name.zip" SOURCE_COMMIT)" = "$sha"
          done
          sha256sum *.aar *.zip > SHA256SUMS.txt
          notes="Android (ARMv7, ARM64, x86-64 and universal AARs); iOS and macOS (WCDBSwift XCFrameworks); Windows and Linux (x86-64 C++ SDKs); OpenHarmony (ARM64 C++ SDK). See SHA256SUMS.txt for integrity checks."
          if [[ "$BACKFILL" == true ]]; then
            gh release upload "$TAG" -R "$REPO" *.zip SHA256SUMS.txt --clobber
            gh release edit "$TAG" -R "$REPO" --title "WCDB $TAG" --notes "$notes"
          else
            gh release create "$TAG" -R "$REPO" --verify-tag *.aar *.zip SHA256SUMS.txt --title "WCDB $TAG" --notes "$notes"
          fi
